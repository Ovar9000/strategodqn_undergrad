[pytest]
testpaths = test
# Import roots: the training packages (environment, network, settings, ...) and the GUI modules
pythonpath = . "../Python Stratego Game"
python_files = test_*.py
markers =
    slow: takes minutes; run with --runslow
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore:User provided device_type of 'cuda'
